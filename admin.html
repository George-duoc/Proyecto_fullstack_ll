<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/style.css">  <link rel="icon" type="image/x-icon" href="https://static.wikia.nocookie.net/midnightclub/images/4/46/Luxury_Icon.png/revision/latest/scale-to-width-down/455?cb=20231022015656">
</head>

<body>
    <header>
        <div id="navbar"></div>
    </header>


   <div class="modal fade" id="modalProducto" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg"><div class="modal-content">
            <div class="modal-header"><h2 class="modal-title h5" id="tituloModalProducto">Nuevo producto</h2><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
            <form id="formProducto" novalidate>
                <div class="modal-body"><div class="row g-3">
                    <div class="col-md-6"><label for="nombreCarro" class="form-label">Nombre</label><input id="nombreCarro" class="form-control" type="text" required><div id="errorNombreProducto" class="invalid-feedback">Ingresa al menos 3 caracteres.</div></div>
                    <div class="col-md-6"><label for="flavorText" class="form-label">Texto descriptivo</label><input id="flavorText" class="form-control" type="text" required><div class="invalid-feedback">Ingresa al menos 3 caracteres.</div></div>
                    <div class="col-md-6"><label for="precioCarro" class="form-label">Precio</label><input id="precioCarro" class="form-control" type="number" min="1" required><div class="invalid-feedback">El precio debe ser mayor que 0.</div></div>
                    <div class="col-12"><label for="imagenCarro" class="form-label">URL de imagen</label><input id="imagenCarro" class="form-control" type="url" placeholder="https://..." required><div class="invalid-feedback">Ingresa una URL http/https válida.</div></div>
                </div></div>
                <div class="modal-footer"><button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button><button type="submit" class="btn btn-success">Guardar producto</button></div>
            </form>
        </div></div>
    </div>
<!--Tengo sueño.-->
    <div class="modal fade" id="modalEliminar" tabindex="-1" aria-hidden="false">
        <div class="modal-dialog"><div class="modal-content">
            <div class="modal-header"><h2 class="modal-title h5">Confirmar eliminación</h2><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
            <div class="modal-body">¿Está seguro de eliminar <strong id="nombreProductoEliminar"></strong>? También se quitará del carrito si estaba agregado.</div>
            <div class="modal-footer"><button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button><button id="confirmarEliminarProducto" type="button" class="btn btn-danger">Eliminar</button></div>
        </div></div>
    </div>

    <main class="container mt-5"> 
        <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-3">
            <div><h1 class="fw-bold mb-1">Panel de Administración</h1></div>
            <div class="d-flex gap-2"><button id="btn-nuevocarro" class="btn btn-success">+ Agregar Vehículo</button><button id="btnCerrarSesion" class="btn btn-outline-danger">Cerrar sesión</button></div>
        </div>
        
        <div id="contenedor"></div>

        
    </main>
<div id="footer">
</div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  
    <script src="js/usuario.js"></script>
    <script src="js/assetsvisual.js"></script>  
    <script src="js/catalogo.js"></script>
    <script src="js/admin.js"></script>
</body>
