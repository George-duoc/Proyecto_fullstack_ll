<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/style.css">  <link rel="icon" type="image/x-icon" href="https://static.wikia.nocookie.net/midnightclub/images/4/46/Luxury_Icon.png/revision/latest/scale-to-width-down/455?cb=20231022015656">
</head>
<body>

  <div id="navbar"></div>
    </header>
        <main class="login-container d-flex align-items-center justify-content-center min-vh-100">
          
            <div class="container py-5">
                <div class="row justify-content-center">
                    <div class="col-md-8 col-lg-6">

                        <div class="card shadow border-0 rounded-4">
                            <div class="card-body p-4 p-md-5">

                                <h2 class="text-center mb-2">Iniciar sesión</h2>
                                <div class="alert alert-info text-center mb-4" role="status">
                                    Demo disponible con usuario <strong>admin</strong> y contraseña <strong>1234</strong>.
                                </div>
                                <form id="loginForm">
                                    <div class="mb-3">
                                        <label for="username" class="form-label fw-semibold">
                                            Usuario
                                        </label>
                                        <input type="text" class="form-control form-control-lg" id="username"
                                            placeholder="admin" required>
                                    </div>
                                    <div class="mb-3">
                                        <label for="password" class="form-label fw-semibold">
                                            Contraseña
                                        </label>
                                        <div class="input-group">
                                            <input type="password" class="form-control form-control-lg" id="password"
                                                placeholder="Ingresa tu contraseña" required>
                                            <button class="btn btn-outline-secondary" type="button" id="togglePassword"
                                                title="Mostrar/Ocultar contraseña">
                                                <i class="bi bi-eye"></i>
                                            </button>
                                        </div>
                                    </div>
                                    <div class="d-grid">
                                        <button type="submit" class="btn btn-primary btn-lg rounded-3">
                                            Ingresar a mi cuenta
                                        </button>
                                    </div>
                                    <div id="loginMessage" class="alert d-none mt-3 mb-0" role="alert"></div>
                                </form>

                                <div class="toast-container position-fixed top-0 end-0 p-3">
                                    <div id="loginToast" class="toast align-items-center text-white border-0" role="alert" aria-live="assertive" aria-atomic="true">
                                        <div class="d-flex">
                                            <div class="toast-body" id="toastMessage"></div>
                                            <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
       <div id="footer"></div>
       
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <script src="js/login.js"></script>
        <script src="js/assetsvisual.js"></script> 
        <script src="js/catalogo.js"></script>
</body>

</html>
