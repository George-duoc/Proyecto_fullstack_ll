<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav class="navbar navbar-expand-lg bg-black" data-bs-theme="dark">
            <div class="container-fluid">
                <a class="navbar-brand" href="home.html">Automotora X</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                    aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav me-auto">
                        <li class="nav-item">
                            <a class="nav-link active" aria-current="page" href="login.html">Login</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="nosotros.html">Nosotros</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="autos.html">Catálogo</a>
                        </li>
                    </ul>

                    <div class="d-flex">
                        <a href="carrito.html" class="btn btn-outline-light d-flex align-items-center">
                            <i class="bi bi-cart3 me-2"></i> Carrito
                        </a>
                    </div>

                </div>
            </div>
        </nav>
    </header>
        <main class="login-container d-flex align-items-center justify-content-center min-vh-100">
            <div id="navbar"></div>
            <div class="container py-5">
                <div class="row justify-content-center">
                    <div class="col-md-8 col-lg-6">

                        <div class="card shadow border-0 rounded-4">
                            <div class="card-body p-4 p-md-5">

                                <h2 class="text-center mb-2">Iniciar sesión</h2>
                                <div class="alert alert-info text-center mb-4" role="status">
                                    Demo disponible con usuario <strong>admin</strong> y contraseña <strong>1234</strong>.
                                </div>
                                <form id="loginForm">
                                    <div class="mb-3">
                                        <label for="username" class="form-label fw-semibold">
                                            Usuario
                                        </label>
                                        <input type="text" class="form-control form-control-lg" id="username"
                                            placeholder="admin" required>
                                    </div>
                                    <div class="mb-3">
                                        <label for="password" class="form-label fw-semibold">
                                            Contraseña
                                        </label>
                                        <div class="input-group">
                                            <input type="password" class="form-control form-control-lg" id="password"
                                                placeholder="Ingresa tu contraseña" required>
                                            <button class="btn btn-outline-secondary" type="button" id="togglePassword"
                                                title="Mostrar/Ocultar contraseña">
                                                <i class="bi bi-eye"></i>
                                            </button>
                                        </div>
                                    </div>
                                    <div class="d-grid">
                                        <button type="submit" class="btn btn-primary btn-lg rounded-3">
                                            Ingresar a mi cuenta
                                        </button>
                                    </div>
                                    <div id="loginMessage" class="alert d-none mt-3 mb-0" role="alert"></div>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
        <footer class="site-footer bg-dark text-white py-5">
            <div class="container">
                        <div class="row">
                            <div class="col-md-4 mb-4 mb-md-0">
                                <img src="Logo-removebg-preview.png" class="footer-logo img-fluid" alt="Logo Automotora X">
                            </div>

                            <div class="col-md-4 mb-4 mb-md-0">
                                <h5 class="border-bottom border-secondary pb-2 mb-3">Síguenos!</h5>
                                <ul class="list-unstyled">
                                    <li>
                                        <p>Instagram: @AutomotoraX</p>
                                    </li>
                                    <li>
                                        <p>Facebook: Automotora X</p>
                                    </li>
                                </ul>
                            </div>
                            <div class="col-md-6">
                                <h5 class="border-bottom border-secondary pb-2 mb-3">Contacto</h5>
                                <p class="text-white-50 mb-1"><i class="bi bi-envelope me-2"></i>ventas@automotorax.cl
                                </p>
                                <p class="text-white-50"><i class="bi bi-telephone me-2"></i>+56 9 1234 5678</p>
                            </div>
                        </div>
            </div>
        </footer>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <script src="login.js"></script>
</body>

</html>
